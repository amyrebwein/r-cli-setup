# Conda environment for R work: terminal-only (radian), conda-forge only.
# Rebuild: conda env create -f environment.yml
# Then install the documented exceptions in r-extras.txt.
# Rule: add packages with `conda install -c conda-forge r-<name>` AND a line here.
name: r_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  # R itself and the terminal REPL
  - r-base=4.5
  - radian
  - r-languageserver
  # Package development (medexhibit)
  - r-devtools
  - r-usethis
  - r-testthat
  - r-roxygen2
  - r-lintr
  - r-styler
  - r-covr
  - r-pkgdown
  - r-vdiffr
  # Tidyverse and data import
  - r-tidyverse
  - r-readxl
  - r-haven
  - r-here
  - r-janitor
  - r-scales
  # Textbook chapters 4 to 8 and the guides' extensions
  - r-gapminder
  - r-gtsummary
  - r-gt
  - r-flextable
  - r-broom
  - r-ggally
  - r-ggpubr
  - r-patchwork
  - r-proc
  - r-dbplyr
  - r-rsqlite
  # Likely needed by later textbook chapters (survival, missing data)
  - r-survival
  - r-survminer
  - r-flexsurv
  - r-mice
  - r-naniar
  - r-vim
  - r-visdat
  # Previously installed in r_env (kept so nothing you use breaks)
  - r-essentials
  - r-svglite
  - r-irkernel
  - jupyterlab
  - matplotlib
  - cookiecutter
  # Previously installed with install.packages(); now from conda (some are only dependencies, harmless)
